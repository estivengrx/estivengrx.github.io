<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script defer src="{{ '/assets/js/theme.js' | relative_url }}"></script>
    {% if page.math %}<script>
      window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}, svg: {fontCache: 'global'}};
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="{{ '/' | relative_url }}">EC<span>.</span></a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/projects/' | relative_url }}">Projects</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="{{ '/skills/' | relative_url }}">Skills</a>
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
        <button class="theme-toggle" type="button" aria-label="Toggle color theme">◐</button>
      </div>
    </header>
    <main id="main" class="container">{{ content }}</main>
    <footer class="site-footer">
      <div class="container footer-wrap">
        <span>Estiven Castrillón · Physics</span>
        <a href="https://github.com/estivengrx">GitHub</a>
        <a href="https://www.linkedin.com/in/estiven-castrillon-72823a253/">LinkedIn</a>
      </div>
    </footer>
  </body>
</html>
